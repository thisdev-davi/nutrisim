name: Frontend Pipeline

on:
  push:
    branches:
      - desenvolvimento
    paths: # so roda (e publica) quando o frontend muda
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
      - desenvolvimento

jobs:
    frontend-lint-test: # Representa o nome da vm criada para executar o CI do front
      name: Frontend Lint & Test
      runs-on: ubuntu-latest # Representa qual SO vai executar
      defaults:
        run:
          working-directory: ./frontend/src # Identifica que por padrão deve abrir o diretorio do frontend.    
      
      steps: # Steps representa a lista de comandos executadas em ordem
        - name: Checkout do código # Nome do comando
          uses: actions/checkout@v4 # Comando pronto do github. Faz um clone do repositorio para dentro da VM
        
        - name: Setup Node.js
          uses: actions/setup-node@v4 # Instala o Node.js na máquina
          with:
            node-version: '20' # Fixa versão para evitar que atualizacão do Node quebre o projeto
            cache: npm 
            cache-dependency-path: ./frontend/src/package-lock.json # Representa o cache das dependencias, para evitar baixar novamente
        
        - name: Instalar dependencias
          run: npm ci
        
        - name: Rodar Lint
          run: npm run lint
        
        - name: Rodar Testes
          run: npm run test

    deploy: # publica no render so depois do lint e dos testes passarem
      name: Deploy no Render
      needs: frontend-lint-test
      if: github.event_name == 'push'
      runs-on: ubuntu-latest
      steps:
        - name: Disparar deploy do commit testado
          run: |
            curl -fsS -X POST https://api.render.com/v1/services/srv-dbfo93l9el5s73fvk6t0/deploys \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"commitId": "${{ github.sha }}"}'
