name: Backend Pipeline

on: # Condicao para executar
  push:
    branches:
      - main
      - desenvolvimento
    paths: # so roda (e publica) quando o backend muda
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - main
      - desenvolvimento

jobs:
  brackend-lint-test: # Representa o nome da VM criada para rodar o CI do back
    name: Backend Lint 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Identifica que por padrão deve abrir o diretorio do backend.
    
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4 # Clona o repositorio
      
      - name: Instalar e configurar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true # Avisa para usar o cache (baixa novamente se o uv.lock tiver modificacao)
          cache-dependency-glob: "./backend/uv.lock"
      
      - name: Setup Python via uv
        run: uv python install 3.11

      - name: Instalar dependencias
        run: uv sync --frozen
      
      - name: Rodar Lint com Ruff
        run: uv run ruff check .
      
      - name: Rodar testes com Pytest
        run: uv run pytest

  deploy: # publica no render so depois do lint e dos testes passarem
    name: Deploy no Render
    needs: brackend-lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/desenvolvimento'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy do commit testado
        run: |
          curl -fsS -X POST https://api.render.com/v1/services/srv-dbfo436i0phs73d83j1g/deploys \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"commitId": "${{ github.sha }}"}'
